buildscript {
	dependencies {
		classpath 'org.flywaydb:flyway-core:11.13.0'
		classpath 'org.flywaydb:flyway-database-postgresql:11.13.0'
	}
}

plugins {
	id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '11.20.0'
	id 'jacoco'
}

group = 'com.eskcti.algashop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

sourceSets {
    main {
        java { exclude '.opencode/**' }
        resources { exclude '.opencode/**', '.agents/**' }
    }
    test {
        java { exclude '.opencode/**' }
        resources { exclude '.opencode/**', '.agents/**' }
    }
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	mockitoAgent
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.2")
	set('springCloudCircuitbreakerVersion', "5.0.2")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-circuitbreaker-dependencies:${springCloudCircuitbreakerVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'
	implementation 'commons-validator:commons-validator:1.9.0'
	implementation 'io.hypersistence:hypersistence-tsid:2.1.4'
  implementation 'org.junit.jupiter:junit-jupiter:5.8.1'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.modelmapper:modelmapper:3.2.4'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-framework-retry'

	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	
	implementation 'org.apache.commons:commons-lang3:3.18.0'
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
  compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.wiremock:wiremock-standalone:3.13.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	testImplementation 'org.assertj:assertj-core:3.27.3'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
	mockitoAgent('org.mockito:mockito-core:5.14.2') {transitive = false}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Test).configureEach {
	maxParallelForks = 1
	jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading'
}

test {
	filter {
		excludeTestsMatching("*IT")
	}
	systemProperty 'spring.profiles.active', 'test'
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

tasks.named('check') {
	dependsOn(test, integrationTest)
}

tasks.register('integrationTest', Test) {
  description = 'Run integration tests.'
  group = 'verification'
	systemProperty 'spring.profiles.active', 'it'
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"

  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath

  shouldRunAfter test

  useJUnitPlatform()

  testLogging {
    events "passed"
  }

  filter {
    includeTestsMatching "*IT"
    excludeTestsMatching "*Test"
    failOnNoMatchingTests = false
  }
}

bootJar {
	archiveFileName = 'billing.jar'
}

tasks.register('dockerBuild', Exec) {
	description = 'Builds a multi-platform Docker image using Buildx'
	group = 'build'
	dependsOn('bootJar')
	workingDir project.rootDir
	commandLine 'docker', 'buildx', 'build', '--platform', 'linux/arm64/v8,linux/amd64',
			'--tag', 'algashop/billing:dev', '.'
}

def jacocoCoverageExcludes = [
	'**/BillingApplication.class',
	'**/DomainException.class',
	'**/DomainEntityNotFoundException.class',
	'**/CreditCardNotFoundException.class',
	'**/InvoiceNotFoundException.class',
	'**/BadGatewayException.class',
	'**/GatewayTimeoutException.class',
	'**/ModelMapperConfig.class',
	'**/FastpayFastpayPaymentAPIClientConfig.class',
	'**/FastpayCreditCardAPIClientConfig.class',
	'**/FastpayCreditCardTokenizationAPIClientConfig.class',
	'**/AlgaShopPaymentPropreties.class',
	'**/FastpayProperties.class',
	'**/FastpayEnumConverter.class',
	'**/InvoiceEventListener.class',
	'**/CreditCardQueryServiceImpl.class',
	"**/CustomRedisCacheHealthIndicator.class",
  "**/CustomFrameworkRetryCircuitBreakerHealthIndicator.class"
]

jacocoTestReport {
	dependsOn test, integrationTest
	executionData(test, integrationTest)
	reports {
		xml.required = true
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoCoverageExcludes)
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn test, integrationTest, jacocoTestReport
	executionData(test, integrationTest)
	violationRules {
		rule {
			limit {
				minimum = 0.90
			}
		}
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoCoverageExcludes)
		}))
	}
}

check.dependsOn jacocoTestCoverageVerification

